server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
        - id: employee-service
          uri: lb://employee-service
          predicates:
            - Path=/employee/**
        - id: attendance-service
          uri: lb://attendance-service
          predicates:
            - Path=/attendance/**
        - id: report-service
          uri: lb://report-service
          predicates:
            - Path=/report/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

